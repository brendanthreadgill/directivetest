<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Directive 2">
<meta name="theme-color" content="#040a07">
<title>The Directive: trial</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23040a07'/%3E%3Ccircle cx='90' cy='90' r='50' fill='none' stroke='%23ff4f86' stroke-width='5'/%3E%3Ccircle cx='90' cy='90' r='30' fill='none' stroke='%233bff9e' stroke-width='5'/%3E%3Ccircle cx='90' cy='90' r='9' fill='%23ffb347'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --g:#3bff9e; --g2:#62d9a2; --g3:#28744f; --g4:#1a4f38; --bg:#040a07; --amb:#ffb347; --b:#4ad9ff; --ink:#f1eadb; --dim:#8fa89b; --red:#ff6b6b; }
  *{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  html,body{margin:0;min-height:100%}
  body{background:transparent}
  body{color:var(--g);font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:16px;line-height:1.4;
    -webkit-user-select:none;user-select:none;overflow-x:hidden}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  :focus-visible{outline:1px solid var(--b);outline-offset:2px}
  [hidden]{display:none!important}
  .scan{position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(180deg,rgba(0,0,0,.26) 0 1px,transparent 1px 3px)}

  #bg{position:fixed;top:0;left:0;right:0;height:100vh;height:calc(100lvh + env(safe-area-inset-bottom));background:center/cover no-repeat;opacity:.2;pointer-events:none;z-index:0}
  #index{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:10px;
    padding:max(12px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom))}
  .hdr{display:flex;justify-content:space-between;align-items:center;height:44px;border-bottom:1px solid var(--g3)}
  .hdr .id{font-size:11px;letter-spacing:.2em;text-shadow:0 0 8px rgba(59,255,158,.55)}
  .nav{display:flex;align-items:center;gap:2px}
  .navb{width:38px;height:44px;font-size:11px;color:var(--b)}
  .navb[disabled]{color:var(--g3)}
  .stamp{font-size:10px;letter-spacing:.18em;color:var(--g2);white-space:nowrap}
  body.past .hdr{border-bottom-color:var(--amb)} body.past .stamp{color:var(--amb)}
  .dual{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.18em;height:14px}
  .dual .r{color:var(--amb);font-size:10px;letter-spacing:.18em;height:14px}
  .cap{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.18em;color:var(--g2)}
  .capb{font-size:10px;letter-spacing:.18em;color:var(--g2);height:16px}
  .cap .pct{color:var(--g);text-shadow:0 0 8px rgba(59,255,158,.5)}
  .blk{display:flex;flex-direction:column;gap:6px}

  .tx{border:1px solid var(--g3);padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
  .tx p{margin:0;min-height:40px;font-family:'Chakra Petch','JetBrains Mono',sans-serif;font-size:13px;line-height:1.5;letter-spacing:.02em;color:var(--ink)}
  .cap canvas{flex:1;height:12px;margin:0 10px;display:block}
  .tx.got #txStatus{color:var(--amb)}
  .echo{margin:0;font-family:'Chakra Petch','JetBrains Mono',sans-serif;font-size:11px;line-height:1.45;color:var(--dim);border-top:1px dotted var(--g3);padding-top:6px}
  .echo b{display:block;font-family:'JetBrains Mono',monospace;font-weight:400;font-size:9px;letter-spacing:.16em;color:var(--b);margin-bottom:2px}

  .rows{display:flex;flex-direction:column;gap:3px}
  .row{display:flex;align-items:center;gap:7px;height:48px;border:1px solid var(--g3);padding:3px 3px 3px 3px;background:rgba(4,10,7,.35)}
  .glyph{width:34px;height:34px;flex:0 0 auto;display:block}
  .glyph canvas{width:34px;height:34px;display:block}
  .mid{flex:1;display:flex;flex-direction:column;gap:5px}
  .mid .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:9px;letter-spacing:.16em;white-space:nowrap}
  .mid .lab{color:var(--g)}
  .mid .hint{color:var(--b);letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis}
  .mid .bot{display:flex;align-items:center;gap:7px}
  .val{flex:0 0 52px;font-size:14px;letter-spacing:.02em;color:#8affc1;text-shadow:0 0 8px rgba(59,255,158,.55);white-space:nowrap}
  .val.zero{color:#2f7354;text-shadow:none}
  .val.over{color:var(--amb);text-shadow:0 0 8px rgba(255,179,71,.5)}
  .bar{flex:1;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px;height:12px}
  .seg{border:1px solid var(--g3);transition:background .25s,box-shadow .25s}
  .seg.on{border-color:transparent}
  .cb{width:40px;height:40px;flex:0 0 auto;border:1px solid var(--g3);font-size:16px;color:var(--g)}
  .cb:active{background:var(--g);border-color:var(--g);color:var(--bg)}

  .anch{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}
  .an{height:40px;border:1px solid var(--g3);font-size:10px;letter-spacing:.04em;color:var(--b);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:rgba(4,10,7,.35)}
  .an small{font-size:8px;letter-spacing:.16em;color:var(--g3)}
  .an.on small{color:var(--bg)}
  .an.on{background:var(--g);border-color:var(--g);color:var(--bg);box-shadow:0 0 14px rgba(59,255,158,.4)}

  .week{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:3px}
  .wk{height:24px;border:1px solid var(--g3);position:relative}
  .wk.l1,.wk.l2,.wk.l3,.wk.l4{background-image:repeating-linear-gradient(180deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
  .wk.l1{background-color:rgba(59,255,158,.16);border-color:#2a7a55}
  .wk.l2{background-color:rgba(59,255,158,.34);border-color:#35a06f}
  .wk.l3{background-color:rgba(59,255,158,.58);border-color:var(--g)}
  .wk.l4{background-color:rgba(138,255,193,.9);border-color:#b5ffd8;box-shadow:0 0 10px rgba(59,255,158,.55)}
  .wk.today{border-color:var(--b)}
  .wk.view{outline:1px solid var(--amb);outline-offset:1px}
  .wkl{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.14em;color:var(--g3)}

  .ftr{display:flex;justify-content:space-between;align-items:center;height:44px;border-top:1px solid var(--g3);font-size:10px;letter-spacing:.14em;margin-top:auto}
  .ftr span{color:var(--g2);white-space:nowrap}
  .ftr button{height:44px;padding:0 8px;color:var(--b);letter-spacing:.14em}

  #room{position:fixed;inset:0;background:#0b0508;z-index:20}
  #room canvas{position:absolute;inset:0;width:100%;height:100%}
  #room .fade{position:absolute;left:0;right:0;bottom:0;height:320px;background:linear-gradient(rgba(11,5,8,0),rgba(11,5,8,.95) 60%);pointer-events:none}
  #room .top{position:absolute;top:max(8px,env(safe-area-inset-top));left:10px;right:16px;display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.18em;z-index:2}
  #room .back{height:44px;padding:0 8px;color:var(--b);letter-spacing:.18em}
  #roomTap{position:absolute;top:70px;left:0;right:0;bottom:200px;touch-action:none}
  #room .panel{position:absolute;left:20px;right:20px;bottom:max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;z-index:2}
  #room .hint{font-size:10px;letter-spacing:.14em;line-height:1.8;color:var(--g2)}
  #room .ctl{display:flex;justify-content:space-between;align-items:center;gap:12px}
  #room .ctl .l{font-size:10px;letter-spacing:.18em;color:var(--g2);line-height:1.8}
  #room .ctl .r{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  #room .big{min-width:64px;text-align:center;font-size:14px;letter-spacing:.06em;color:var(--amb)}
  #room .cb{width:48px;height:44px;font-size:18px;border-color:#2f8f66;color:#6fe0ae}
  #room .ranch{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
  #room .ranch .an{background:transparent;border-color:#4a5a1c;color:#e8ff5a}
  #room .ranch .an small{color:#6b7a2a}
  #room .ranch .an.on{background:#e8ff5a;border-color:#e8ff5a;color:#090a04;box-shadow:0 0 14px rgba(232,255,90,.4)}
  #room .ranch .an.on small{color:#090a04}

  .sheet{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;gap:12px;z-index:40;overflow:auto;-webkit-overflow-scrolling:touch;
    padding:calc(env(safe-area-inset-top) + 58px) 16px calc(env(safe-area-inset-bottom) + 24px)}
  .sheet.open{display:flex}
  .sheet h2{font-size:11px;letter-spacing:.22em;margin:0;font-weight:400}
  .sheet .close{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:12px;width:44px;height:44px;font-size:18px;color:var(--b);border:1px solid var(--g3);background:var(--bg);z-index:45}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  .acts button{border:1px solid var(--g3);color:var(--b);height:44px;padding:0 12px;font-size:10px;letter-spacing:.14em}
  .acts button:active{background:var(--g);border-color:var(--g);color:var(--bg)}
  .acts button.danger{color:var(--red)}
  table{width:100%;border-collapse:collapse;font-size:10px}
  th{color:var(--g2);font-weight:400;text-align:right;padding:6px 2px;border-bottom:1px solid var(--g3);letter-spacing:.06em;font-size:9px}
  th:first-child,td:first-child{text-align:left}
  td{text-align:right;padding:6px 2px;border-bottom:1px dotted var(--g3);color:var(--amb)}
  td:first-child{color:var(--g)}
  .tip{font-size:10px;color:var(--g2);line-height:1.7;letter-spacing:.06em;margin:0}
  .fld{display:flex;flex-direction:column;gap:5px;font-size:9px;letter-spacing:.16em;color:var(--g2)}
  .fld input,.fld textarea{font:inherit;font-size:16px;letter-spacing:.02em;color:var(--ink);background:transparent;border:1px solid var(--g3);border-radius:0;padding:8px;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
  .fld textarea{font-family:'Chakra Petch',sans-serif;font-size:16px;line-height:1.45;min-height:120px;resize:vertical}
  .tg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .rstate{margin:0;font-family:'Chakra Petch',sans-serif;font-size:15px;line-height:1.5;color:var(--ink)}
  #pincer{width:100%;height:72px;display:block}
  .rdvb{display:flex;flex-direction:column;gap:14px}
  .pinl{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.14em;color:var(--g2)}
  .entry{border-bottom:1px dotted var(--g3);padding:10px 0}
  .entry .d{font-size:10px;letter-spacing:.18em;color:var(--amb)}
.entry .ec{font-family:'Chakra Petch',sans-serif;font-size:11px;line-height:1.45;color:var(--dim);margin-top:6px}
  .entry .t{font-family:'Chakra Petch','JetBrains Mono',sans-serif;font-size:13px;line-height:1.5;color:var(--ink);margin-top:4px}

  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(18px);background:var(--g);color:var(--bg);padding:9px 18px;font-size:10px;letter-spacing:.2em;opacity:0;transition:.2s;pointer-events:none;z-index:60;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="bg" aria-hidden="true"></div>
<main id="index">
  <div class="hdr">
    <span class="id">DIRECTIVE</span>
    <span class="nav">
      <button class="navb" id="prevDay" aria-label="Previous day">&#9664;</button>
      <span class="stamp" id="stamp"></span>
      <button class="navb" id="nextDay" aria-label="Next day">&#9654;</button>
    </span>
  </div>
  <div class="dual"><span id="dayNo"></span><button class="r" id="rdv"></button></div>

  <section class="tx" id="tx">
    <div class="cap"><span>&gt; TRANSMISSION</span><canvas id="txWave" aria-hidden="true"></canvas><span id="txStatus"></span></div>
    <p id="txText"></p>
    <p class="echo" id="txEcho" hidden></p>
  </section>

  <section class="blk">
    <div class="cap"><span>&gt; LEDGER</span><span class="pct" id="dayPct"></span></div>
    <div class="rows" id="rows"></div>
  </section>

  <section class="blk">
    <div class="cap"><button class="capb" id="openAnch">&gt; ANCHORS ▸</button><span id="sqCount"></span></div>
    <div class="anch" id="anchors"></div>
  </section>

  <section class="blk">
    <div class="cap"><span>&gt; LAST 14 DAYS</span><span id="weekAvg"></span></div>
    <div class="week" id="week"></div>
    <div class="wkl"><span id="wkFrom"></span><span id="wkTo"></span></div>
  </section>

  <div class="ftr">
    <span id="runTxt"></span>
    <span>
      <button id="openDiary">DIARY</button>
      <button id="openArch">ARCHIVE</button>
    </span>
  </div>
</main>

<div id="room" hidden>
  <canvas id="roomCv" aria-hidden="true"></canvas>
  <div class="fade" id="roomFade"></div>
  <div class="top">
    <button class="back" id="roomBack">&#9664; INDEX</button>
    <span id="roomStat"></span>
  </div>
  <button id="roomTap" aria-label="Add"></button>
  <div class="panel">
    <span class="hint" id="roomHint"></span>
    <div class="ctl">
      <span class="l"><span id="roomName"></span><br><span id="roomTotal"></span></span>
      <span class="r" id="roomCtl">
        <button class="cb" id="roomDec" aria-label="Correct this day by one step down">&minus;</button>
        <span class="big" id="roomVal"></span>
        <button class="cb" id="roomInc" aria-label="Add one step">+</button>
      </span>
    </div>
    <div class="ranch" id="roomAnch" hidden></div>
  </div>
</div>

<div class="sheet" id="sheet">
  <button class="close" id="closeSheet" aria-label="Close">&#10005;</button>
  <h2 id="sheetTitle"></h2>
  <div class="acts" id="sheetActs"></div>
  <p class="tip" id="sheetNote"></p>
  <div id="sheetBody"></div>
  <p class="tip">STORED ON THIS PHONE ONLY. NOTHING IS TRANSMITTED.<br>EXPORT A BACKUP NOW AND THEN; CLEARING BROWSER DATA ERASES IT.</p>
</div>

<div class="scan"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var KEY='directive.v2.trial', OLD='directive.console.v1';
  function $(id){ return document.getElementById(id); }
  function pad(n,w){ return String(n).padStart(w||2,'0'); }
  function dkey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function parseKey(k){ var p=k.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
  function addDays(k,n){ var d=parseKey(k); d.setDate(d.getDate()+n); return dkey(d); }
  function hm(v){ return Math.floor(v/60)+'h'+pad(v%60); }
  function mins(v){ return v+'m'; }
  function num(v){ return v.toLocaleString('en-US'); }

  var METRICS=[
    {id:'steps',    label:'STEPS',    step:500, fmt:num,  col:'255,122,89'},
    {id:'sleep',    label:'SLEEP',    step:15,  fmt:hm,   col:'124,140,255'},
    {id:'calories', label:'CALORIES', step:20,  fmt:num,  col:'236,226,205'},
    {id:'gym',      label:'GYM',      step:10,  fmt:mins, col:'255,79,134', room:true},
    {id:'basilisk', label:'BASILISK', step:15,  fmt:mins, col:'64,224,208'},
    {id:'stretch',  label:'STRETCH',  step:10,  fmt:mins, col:'181,140,255'}
  ];
  var ANCHORS=[
    {id:'arrival',n:'ARRIVE',s:'INIT'},{id:'t0900',n:'09:00',s:'FWD'},{id:'t1200',n:'12:00',s:'MID'},{id:'t1400',n:'14:00',s:'INV'},{id:'departure',n:'DEPART',s:'CLOSE'}
  ];
  // Trial set only. Throwaway placeholders, not part of any deck.
  var DECK=[
    "At 07:10 you remembered cold tile under bare feet, and stood on one leg while the kettle finished.",
    "At 10:15 you remembered a cat unfolding in a doorway, and did the same against the frame.",
    "At 12:30 you remembered bread torn by hand, and ate the first half of lunch without a screen.",
    "At 15:00 you remembered wet gravel on a ridge path, and took the long way round the building.",
    "At 16:40 you remembered the top of a long staircase, and climbed two flights you did not need to.",
    "At 18:00 you remembered a full pack on the last switchback, and carried the heavy thing slowly.",
    "At 20:30 you remembered sitting low by a fire, and rested in a deep squat until the breath slowed.",
    "At 21:00 you remembered reaching for the top shelf as a child, and held your arms overhead for a slow count of thirty.",
    "At 22:30 you remembered a tent going quiet, and left the phone in another room.",
    "At 09:00 you remembered water from a cold tap in summer, and drank a full glass before anything else."
  ];

  var still=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var today=dkey(new Date()), viewKey=today;
  var store;
  try{
    var raw=localStorage.getItem(KEY);
    if(raw) store=JSON.parse(raw);
  }catch(e){ console.warn('read failed',e); }
  if(!store||typeof store!=='object') store={v:2,days:{},txPos:0,start:today,lastExport:null,importedV1:false};
  store.days=store.days||{};
  if(typeof store.txPos!=='number') store.txPos=0;
  if(!store.start) store.start=today;
  // Trial operation: rendezvous and targets live in the store and are editable on the Rendezvous screen.
  var DEFAULT_TARGETS={steps:17000,sleep:420,calories:2200,gym:60,basilisk:60,stretch:20};
  var DEFAULT_STATE="On 23 December you arrived lean, limber and lithe. Strong, but not built. More flexible through the hips, hamstrings and spine; the floor easy to reach. Three to four pounds of fat gone, the muscle tone kept.";
  if(!store.targets) store.targets={};
  for(var tk in DEFAULT_TARGETS) if(!(store.targets[tk]>0)) store.targets[tk]=DEFAULT_TARGETS[tk];
  if(!store.rdv) store.rdv={date:'2026-12-23',state:DEFAULT_STATE};

  var saveTimer=null;
  function save(){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(function(){
      try{ localStorage.setItem(KEY,JSON.stringify(store)); }
      catch(e){ toast('SAVE FAILED'); console.warn(e); }
    },100);
  }
  function blank(){ return {steps:0,sleep:0,calories:0,gym:0,basilisk:0,stretch:0,squats:[],tx:null}; }
  function peek(k){ return store.days[k]||blank(); }
  function touch(k){
    if(!store.days[k]) store.days[k]=blank();
    var d=store.days[k]; if(!Array.isArray(d.squats)) d.squats=[];
    return d;
  }
  function hasEntry(d){
    if(!d) return false;
    for(var i=0;i<METRICS.length;i++) if((d[METRICS[i].id]||0)>0) return true;
    return (d.squats||[]).length>0;
  }

  var toastEl=$('toast'), tTimer=null;
  function toast(m){ toastEl.textContent=m; toastEl.classList.add('show'); clearTimeout(tTimer); tTimer=setTimeout(function(){ toastEl.classList.remove('show'); },1600); }
  function buzz(){ if(navigator.vibrate) navigator.vibrate(8); }

  // ---------- header ----------
  var DAYS=['SUN','MON','TUE','WED','THU','FRI','SAT'], MONS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  var EARLIEST=addDays(today,-30);
  function paintHeader(){
    var d=parseKey(viewKey), isNow=viewKey===today;
    $('stamp').textContent=DAYS[d.getDay()]+' '+pad(d.getDate())+' '+MONS[d.getMonth()];
    document.body.classList.toggle('past',!isNow);
    $('nextDay').disabled=isNow;
    $('prevDay').disabled=viewKey<=EARLIEST;
    var n=dayIndex(viewKey)+1, N=rdvSpan()+1, left=daysBetween(viewKey,store.rdv.date);
    $('dayNo').textContent=n>=1 ? 'DAY '+pad(n,3)+' / '+pad(N,3)+' →' : 'BEFORE THE OPERATION';
    var rd=parseKey(store.rdv.date), lab=pad(rd.getDate())+' '+MONS[rd.getMonth()];
    $('rdv').textContent=left>0 ? '← T−'+left+' // '+lab : (left===0 ? '◆ RENDEZVOUS // TODAY' : 'RENDEZVOUS +'+(-left));
  }
  function daysBetween(a,b){ return Math.round((parseKey(b)-parseKey(a))/864e5); }
  function dayIndex(k){ return daysBetween(store.start,k); }
  function rdvSpan(){ return Math.max(1,daysBetween(store.start,store.rdv.date)); }

  // ---------- transmission ----------
  // The line arrives a few characters at a time; tap it to skip.
  var typed='', typeTimer=null, typing=false;
  function typeTx(text){
    var el=$('txText');
    if(text===typed) return;
    typed=text; clearInterval(typeTimer);
    if(still){ el.textContent=text; typing=false; return; }
    var n=0; typing=true;
    typeTimer=setInterval(function(){
      n+=2;

  }

  // --- 01 STEPS: territory. Each day walks its own path out from the centre, one stretch per 500 steps. ---
  var WALKS={};
  function walk(k,n,R){
    var key=k+':'+n+':'+Math.round(R); if(WALKS[key]) return WALKS[key];
    var r=srand('steps'+k), pts=[[0,0]], a=r()*6.2832, x=0, y=0, far=0;
    for(var i=0;i<n;i++){

  }
  function drawSteps(X){
    var g=X.g, now=X.now, dpr=X.dpr, R=X.R, rot=yaw*0.6, cr=Math.cos(rot), sr=Math.sin(rot), t=still?0:now*0.0008, far=0, j;
    function P(p,j,s){ var x=p[0]+(still?0:Math.sin(t+j*0.35+s)*R*0.006), y=p[1]+(still?0:Math.cos(t*0.8+j*0.3+s)*R*0.006); return [X.cx+x*cr-y*sr,X.cy+x*sr+y*cr]; }
    g.lineWidth=0.6*dpr;
    RH.forEach(function(h,i){
      var pts=walk(h.k,Math.floor(h.v/500),R), al=ageAl(h.age)*0.85;
      for(var j=1;j<pts.length;j++){ var a=P(pts[j-1],j-1,i), b=P(pts[j],j,i); seg(g,a[0],a[1],b[0],b[1],rgba('255,122,89',al+rb((a[0]+b[0])/2,(a[1]+b[1])/2,now,dpr)*0.5)); }
      far=Math.max(far,pts.far);
    });
    var n=Math.floor(X.v/500), pts=walk(viewKey,n,R), tip=P(pts[0],0,99);
    glow(g,'255,170,120',dpr); g.lineWidth=0.9*dpr;
    for(j=1;j<pts.length;j++){
      var a=P(pts[j-1],j-1,99), b=P(pts[j],j,99), part=bornPart(j-1,now);
      b=[a[0]+(b[0]-a[0])*part,a[1]+(b[1]-a[1])*part];
      seg(g,a[0],a[1],b[0],b[1],rgba('255,215,180',0.95)); tip=b;
    }

    g.lineWidth=0.5*dpr; g.beginPath(); g.arc(X.cx,X.cy,far+8*dpr,0,6.2832); g.strokeStyle=rgba('255,179,71',0.2); g.stroke();
    // possible paths ahead: they draw out from where you stand and fade
    if(!still){
      var cyc=2600, ph=(now%cyc)/cyc, r=srand('f'+Math.floor(now/cyc)), fade=ph<0.45?1:cl(1-(ph-0.45)/0.55);
      g.lineWidth=0.6*dpr;
      for(var bI=0;bI<3;bI++){
        var x=tip[0], y=tip[1], a2=r()*6.2832, path=[[x,y]];
        for(var s=0;s<8;s++){ a2+=(r()-0.5)*1.1; x+=Math.cos(a2)*R*0.05; y+=Math.sin(a2)*R*0.05; path.push([x,y]); }
        var shown=Math.min(8,ph/0.45*8);
        g.beginPath(); g.moveTo(path[0][0],path[0][1]);
        for(s=1;s<=Math.ceil(shown);s++){ var q=path[s], p0=path[s-1], f=Math.min(1,shown-(s-1)); g.lineTo(p0[0]+(q[0]-p0[0])*f,p0[1]+(q[1]-p0[1])*f); }

  }

  // --- 02 SLEEP: iris. Each 15 minutes is one ray; the pupil closes as the night fills. ---
  var FLECKS=null;

    g.lineWidth=0.6*dpr; g.beginPath(); g.arc(cx,cy,pupil,0,6.2832); g.strokeStyle=rgba('214,208,240',0.45); g.stroke();
  }

  // --- 03 CALORIES: strata. One layer a day, its length the day's intake; the vertical line is the target. ---
  var SED=null;

    var g=X.g, now=X.now, dpr=X.dpr, W=X.W, H=X.H, x0=W*0.1, full=W*0.8, tx=x0+full/1.25, base=H*0.62, t=still?0:now*0.0006;

  }

  // --- 05 BASILISK: coil. Each 15 minutes is one strand in a slow braid; drag to twist it. ---
  function drawBasilisk(X){
    var g=X.g, now=X.now, dpr=X.dpr, W=X.W, H=X.H, top=H*0.1, bot=H*0.66, cx=X.cx, A=W*0.16, w=W*0.11, t=(still?0:now*0.0009)+yaw*2;
    var ages=[]; RH.forEach(function(h){ var n=Math.floor(h.v/15); for(var u=0;u<n&&ages.length<360;u++) ages.push(h.age); });
    var nP=ages.length, nT=Math.floor(X.v/15), i;
    function at(i,u){ var o=((i*0.618034)%1)*2-1, ww=Math.sin(u*Math.PI)*w; return [cx+Math.sin(u*7+t)*A*0.9+o*ww*Math.cos(u*9-t*0.7), top+u*(bot-top), o]; }

  }

  // --- 06 STRETCH: range. Each 10 minutes is an arc; the opening widens as minutes accumulate toward the rendezvous. ---
  var SPOKES=null;
  function drawStretch(X){
    var g=X.g, now=X.now, dpr=X.dpr, cx=X.cx, cy=X.H*0.48, rMax=X.R*1.02, up=-Math.PI/2+Math.sin(yaw)*0.25, i;

    var nP=arcs.length, nT=Math.floor(X.v/10), N=nP+nT, cumT=cum+X.v, br=still?0:0.05*Math.sin(now*0.0009);

    });

    glow(g,'255,190,240',dpr); g.lineWidth=0.8*dpr;
    for(i=0;i<nT;i++){ var r=22*dpr+(nP+i)*step, op=opT*bornPart(i,now); g.beginPath(); g.arc(cx,cy,r,up-op/2,up+op/2); g.strokeStyle=rgba('255,215,245',0.92); g.stroke(); }
    g.shadowBlur=0;

      if(!SPOKES){ var sr=srand('spokes'); SPOKES=[]; for(i=0;i<14;i++) SPOKES.push([sr()-0.5,sr()*6.2832,0.6+sr()]); }
      var rOut=22*dpr+Math.max(N,1)*step; g.lineWidth=0.5*dpr;

  // --- 07 ANCHORS: clock. One ring a day, a mark for each anchor held; the hand keeps real time. ---

    });

    g.lineWidth=0.8*dpr; seg(g,cx,cy,cx+Math.cos(ha)*R*1.02,cy+Math.sin(ha)*R*1.02,rgba('255,179,71',0.8));
    g.beginPath(); g.arc(cx,cy,2.5*dpr,0,6.2832); g.fillStyle='rgba(255,200,120,.95)'; g.fill();
  }
  function anchorAt(x,y){
    var W=cv.width, H=cv.height, dx=x-W/2, dy=y-H*0.40, a=Math.atan2(dy,dx), h=((a+Math.PI/2)/(2*Math.PI)*24+24)%24, best=null, bd=1.3;

  }

  };
  function metricOf(id){ return METRICS.filter(function(m){ return m.id===id; })[0]; }

  function sizeCv(){ var dpr=Math.min(2,window.devicePixelRatio||1); cv.width=Math.round(cv.clientWidth*dpr); cv.height=Math.round(cv.clientHeight*dpr); }
  function drawRoom(now){

    g.globalCompositeOperation='lighter';
    ripples=ripples.filter(function(r){ return now-r.t<1500; });
    var d=peek(viewKey);
    RM.draw({g:g,now:now,W:W,H:H,dpr:W/Math.max(1,cv.clientWidth),cx:W/2,cy:H*0.40,R:Math.min(W*0.44,H*0.26),d:d,
      v:RID==='anchors'?0:(d[RID]||0),T:TARGET[RID]||1});
    g.globalCompositeOperation='source-over'; g.shadowBlur=0;
  }
  function loop(now){ drawRoom(now); if(!still&&!room.hidden) raf=requestAnimationFrame(loop); }
  function hexRgb(h){ return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)].join(','); }
  function paintRoom(){
    RH=hist(RID); if(RID==='gym') C=gymCounts();
    var d=peek(viewKey), m=metricOf(RID);
    $('roomName').textContent='ROOM '+RM.n+' // '+(m?m.label:'ANCHORS');
    $('roomStat').textContent=RM.stat();
    $('roomTotal').textContent=RM.tot()+(viewKey===today?'':' // '+viewKey.slice(5).replace('-','/'));
    $('roomHint').innerHTML=RM.hint();
    if(m) $('roomVal').textContent=m.fmt(d[RID]||0);
    else anchorBtns.forEach(function(x){ var on=(d.squats||[]).indexOf(x.id)>-1; x.el.classList.toggle('on',on); x.el.setAttribute('aria-pressed',on?'true':'false'); });
    if(still) drawRoom(performance.now());
  }
  var anchorBtns=[];
  ANCHORS.forEach(function(a){
    var b=document.createElement('button'); b.className='an'; b.innerHTML=a.n+'<small>'+a.s+'</small>';
    b.addEventListener('click',function(){ toggleAnchor(a.id); });
    $('roomAnch').appendChild(b); anchorBtns.push({el:b,id:a.id});
  });
  function toggleAnchor(id){
    var list=touch(viewKey).squats, i=list.indexOf(id);
    if(i>-1) list.splice(i,1); else { list.push(id); births[id]=performance.now(); }
    buzz(); save(); paintRoom();
  }
  function openRoom(id){
    RID=id; RM=ROOMS[id]; RM.shown=null;
    births={}; sparks=[]; flick=[]; ripples=[]; lastT=0; spin=0;
    var isA=id==='anchors', m=metricOf(id);
    $('roomCtl').hidden=isA; $('roomAnch').hidden=!isA;
    $('roomTap').setAttribute('aria-label',isA?'Hold the nearest anchor':'Add '+(m.fmt===num?m.step:m.step+' minutes'));
    room.style.background=RM.bg;
    $('roomFade').style.background='linear-gradient(rgba('+hexRgb(RM.bg)+',0),'+RM.bg+' 60%)';
    room.hidden=false; sizeCv(); paintRoom(); buzz();
    cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);
  }
  function closeRoom(){ room.hidden=true; cancelAnimationFrame(raf); paintAll(); }
  function ripple(x,y){ ripples.push({x:x,y:y,t:performance.now()}); if(ripples.length>5) ripples.shift(); }
  function rippleCentre(){ ripple(cv.width/2,cv.height*0.40); }
  function roomBump(dir,mult){
    var m=metricOf(RID), d=touch(viewKey), now=performance.now();
    for(var i=0;i<(mult||1);i++){
      var v=d[RID]||0, before=Math.floor(v/m.step);
      d[RID]=Math.max(0,v+dir*m.step);
      if(dir>0) births[before]=now+i*60;
    }
    glyphs[RID].pulse=now; save(); paintRoom();
  }
  var tapEl=$('roomTap');
  tapEl.addEventListener('pointerdown',function(e){
    drag={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,moved:false,lt:performance.now()};
    try{ tapEl.setPointerCapture(e.pointerId); }catch(err){}
  });
  tapEl.addEventListener('pointermove',function(e){
    if(!drag) return;
    var dx=e.clientX-drag.lx, dy=e.clientY-drag.ly;
    if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>8) drag.moved=true;
    if(drag.moved){
      var nt=performance.now(), el=Math.max(8,nt-drag.lt);
      yaw+=dx*0.008; pitch=Math.max(-1.2,Math.min(1.2,pitch+dy*0.008));
      spin=Math.max(-0.012,Math.min(0.012,dx*0.008/el-BASE)); drag.lt=nt;
      if(still) drawRoom(nt);
    }
    drag.lx=e.clientX; drag.ly=e.clientY;
  });
  tapEl.addEventListener('pointerup',function(e){
    if(drag&&!drag.moved){
      var r=cv.getBoundingClientRect(), k=cv.width/r.width, x=(e.clientX-r.left)*k, y=(e.clientY-r.top)*k;
      ripple(x,y);
      if(RID==='anchors'){ var id=anchorAt(x,y); if(id) toggleAnchor(id); }
      else { buzz(); roomBump(1); }
    }
    drag=null;
  });
  tapEl.addEventListener('pointercancel',function(){ drag=null; });
  tapEl.addEventListener('click',function(e){ if(e.detail===0&&RID!=='anchors'){ rippleCentre(); roomBump(1); } });
  $('roomBack').addEventListener('click',closeRoom);
  hold($('roomInc'),function(n){ if(n===1) rippleCentre(); roomBump(1,n); });
  hold($('roomDec'),function(n){ if(n===1) rippleCentre(); roomBump(-1,n); });
  window.addEventListener('resize',function(){ sizeWave(); if(!room.hidden){ sizeCv(); WALKS={}; if(still) drawRoom(performance.now()); } });

  // ---------- sheets ----------
  var sheet=$('sheet');
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function act(label,fn,cls){ var b=document.createElement('button'); b.textContent=label; if(cls) b.className=cls; b.addEventListener('click',fn); $('sheetActs').appendChild(b); return b; }
  function openSheet(title){ $('sheetTitle').textContent=title; $('sheetActs').innerHTML=''; $('sheetNote').textContent=''; $('sheetBody').innerHTML=''; sheet.classList.add('open'); sheet.scrollTop=0; }
  $('closeSheet').addEventListener('click',function(){ sheet.classList.remove('open'); });

  function txText(d){ return d&&d.tx ? DECK[d.tx.id%DECK.length] : ''; }
  function openDiary(){
    openSheet('DIARY');
    var keys=Object.keys(store.days).filter(function(k){ var d=store.days[k]; return !!d.tx; }).sort().reverse();
    $('sheetNote').textContent=keys.length ? keys.length+' ENTRIES. EVERY LINE HERE HAPPENED.' : 'NOTHING RECEIVED YET.';
    $('sheetBody').innerHTML=keys.map(function(k){
      var ec=echoFor(k);
      return '<div class="entry"><div class="d">DAY '+pad(dayIndex(k)+1,3)+' // '+k+'</div><div class="t">'+esc(txText(store.days[k]))+'</div>'+
        (ec?'<div class="ec">↺ ECHO OF DAY '+pad(dayIndex(ec.k)+1,3)+': '+esc(ec.text)+'</div>':'')+'</div>';
    }).join('');
  }
  function histHTML(){
    var keys=Object.keys(store.days).sort().reverse();
    if(!keys.length) return '<p class="tip">NO RECORDS</p>';
    var h='<table><tr><th>DATE</th><th>STEP</th><th>SLP</th><th>CAL</th><th>GYM</th><th>BAS</th><th>STR</th><th>SQ</th><th>TX</th></tr>';
    keys.forEach(function(k){
      var r=store.days[k], t=r.tx?'Y':'';
      h+='<tr><td>'+k.slice(5)+'</td><td>'+num(r.steps||0)+'</td><td>'+hm(r.sleep||0)+'</td><td>'+(r.calories||0)+'</td><td>'+(r.gym||0)+'</td><td>'+(r.basilisk||0)+'</td><td>'+(r.stretch||0)+'</td><td>'+((r.squats||[]).length)+'</td><td>'+t+'</td></tr>';
    });
    return h+'</table>';
  }
  function csv(){
    var out=['date,steps,sleep_minutes,calories,gym_minutes,basilisk_minutes,stretch_minutes,squat_sets,squat_anchors,transmission_status,transmission_text'];
    Object.keys(store.days).sort().forEach(function(k){
      var r=store.days[k];
      out.push([k,r.steps||0,r.sleep||0,r.calories||0,r.gym||0,r.basilisk||0,r.stretch||0,(r.squats||[]).length,
        '"'+(r.squats||[]).join(' ')+'"', r.tx?r.tx.status:'', '"'+txText(r).replace(/"/g,'""')+'"'].join(','));
    });
    return out.join('\n');
  }
  function download(name,text,type){
    var blob=new Blob([text],{type:type}), a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
    store.lastExport=today; save();
  }
  function copyText(text){
    function ok(){ toast('COPIED'); }
    function fb(){ var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); ok(); }catch(e){ toast('COPY FAILED'); } ta.remove(); }
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok,fb); else fb();
  }
  function oldDays(){
    try{ var r=localStorage.getItem(OLD); if(!r) return null; var o=JSON.parse(r); return o&&o.days?o.days:null; }catch(e){ return null; }
  }
  // Background image: chosen from the phone, shrunk, kept on this phone, shown at 20%.
  var BGKEY='directive.v2.bg';
  function applyBg(){ var u=null; try{ u=localStorage.getItem(BGKEY); }catch(e){} $('bg').style.backgroundImage=u?'url("'+u+'")':'none'; return !!u; }
  function pickBg(){
    var inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.addEventListener('change',function(){
      var f=inp.files&&inp.files[0]; if(!f) return;
      var url=URL.createObjectURL(f), im=new Image();
      im.onload=function(){
        var sc=Math.min(1,1400/Math.max(im.width,im.height)), c=document.createElement('canvas');
        c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url);
        try{ localStorage.setItem(BGKEY,c.toDataURL('image/jpeg',0.82)); applyBg(); toast('BACKGROUND SET'); openArch(); }
        catch(e){ toast('IMAGE TOO LARGE'); }
      };
      im.onerror=function(){ URL.revokeObjectURL(url); toast('COULD NOT READ IMAGE'); };
      im.src=url;
    });
    inp.click();
  }
  function openArch(){
    openSheet('ARCHIVE');
    act('BACKGROUND IMAGE',pickBg);
    if(applyBg()) act('REMOVE BACKGROUND',function(){ try{ localStorage.removeItem(BGKEY); }catch(e){} applyBg(); toast('BACKGROUND REMOVED'); openArch(); });
    act('EXPORT CSV',function(){ if(!Object.keys(store.days).length){ toast('NOTHING TO EXPORT'); return; } download('directive-v2-'+today+'.csv',csv(),'text/csv'); toast('EXPORTED'); note(); });
    act('COPY CSV',function(){ copyText(csv()); });
    act('FULL BACKUP',function(){ download('directive-v2-backup-'+today+'.json',JSON.stringify(store),'application/json'); toast('BACKUP SAVED'); note(); });
    var old=oldDays();
    if(old){
      var n=Object.keys(old).filter(function(k){ return !store.days[k]; }).length;
      if(n) act('IMPORT '+n+' OLD DAYS',function(){
        Object.keys(old).forEach(function(k){
          if(store.days[k]) return;
          var o=old[k]||{};
          store.days[k]={steps:o.steps||0,sleep:o.sleep||0,calories:o.calories||0,gym:o.gym||0,basilisk:o.basilisk||0,stretch:o.stretch||0,squats:Array.isArray(o.squats)?o.squats.slice():[],tx:null};
        });
        store.importedV1=true; save(); toast('IMPORTED'); openArch(); paintAll();
      });
    }
    act('CLEAR THIS DAY',function(){
      if(!confirm('Clear all entries for '+viewKey+'?')) return;
      delete store.days[viewKey]; save(); paintAll(); $('sheetBody').innerHTML=histHTML(); toast('RECORD CLEARED');
    },'danger');
    function note(){ $('sheetNote').textContent=store.lastExport?'LAST EXPORT: '+store.lastExport:'NEVER EXPORTED'; }
    note();
    $('sheetBody').innerHTML=histHTML();
  }
  // ---------- rendezvous ----------
  function openRdv(){
    openSheet('RENDEZVOUS');
    var N=rdvSpan(), left=daysBetween(today,store.rdv.date);
    $('sheetNote').textContent=(left>0?left+' DAYS OUT. ':(left===0?'TODAY. ':'')) + 'THE FAR END IS ALREADY WRITTEN; THE LEDGER IS HOW YOU REACH IT.';
    var tg=METRICS.map(function(m){
      var unit=m.fmt===num?'':' (MIN)';
      return '<label class="fld">'+m.label+unit+'<input type="number" inputmode="numeric" min="1" data-t="'+m.id+'" value="'+TARGET[m.id]+'"></label>';
    }).join('');
    $('sheetBody').innerHTML='<div class="rdvb">'+
      '<canvas id="pincer" aria-hidden="true"></canvas>'+
      '<div class="pinl"><span>'+store.start.slice(5).replace('-','/')+' START</span><span>TODAY</span><span>'+store.rdv.date.slice(5).replace('-','/')+' ◆</span></div>'+
      '<p class="rstate">'+esc(store.rdv.state)+'</p>'+
      '<label class="fld">RENDEZVOUS DATE<input type="date" id="rdvDate" value="'+store.rdv.date+'"></label>'+
      '<label class="fld">THE STATE YOU ARRIVED IN<textarea id="rdvState">'+esc(store.rdv.state)+'</textarea></label>'+
      '<div class="cap"><span>&gt; DAILY TARGETS</span></div><div class="tg">'+tg+'</div>'+
      '<div class="acts"><button id="rdvSave2">SAVE</button></div></div>';
    $('rdvSave2').addEventListener('click',saveRdv);
    act('SAVE',saveRdv);
    function saveRdv(){
      var dt=$('rdvDate').value, st=$('rdvState').value.trim();
      if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)||dt<=store.start){ toast('DATE MUST BE AFTER '+store.start); return; }
      store.rdv={date:dt,state:st||DEFAULT_STATE};
      Array.prototype.forEach.call(document.querySelectorAll('[data-t]'),function(inp){ var v=Math.round(+inp.value); if(v>0) TARGET[inp.dataset.t]=v; });
      save(); paintAll(); toast('RENDEZVOUS WRITTEN'); openRdv();
    }
    drawPincer();
  }
  // The pincer: the forward arm runs from the start to today, lit where you logged;
  // the inverted arm runs back from the rendezvous to today. They meet where you are.
  function drawPincer(){
    var c=$('pincer'); if(!c) return;
    var W=c.width=Math.round(c.clientWidth*2), H=c.height=144, g=c.getContext('2d'), N=rdvSpan(), x0=12, x1=W-12, my=H/2, i;
    function X(i){ return x0+(x1-x0)*i/N; }
    var ti=Math.max(0,Math.min(N,dayIndex(today)));
    g.lineWidth=1;
    g.strokeStyle='rgba(40,116,79,.9)'; g.beginPath(); g.moveTo(x0,my); g.lineTo(x1,my); g.stroke();
    for(i=0;i<=N;i++){
      var k=addDays(store.start,i), d=store.days[k], lv=i<=ti?level(d):0, x=X(i);
      if(i<=ti){ var al=[0.25,0.4,0.6,0.8,1][lv]; g.strokeStyle='rgba(59,255,158,'+al+')'; g.beginPath(); g.moveTo(x,my-6-lv*8); g.lineTo(x,my); g.stroke(); }
      else { g.strokeStyle='rgba(255,179,71,'+(0.15+0.5*(i-ti)/Math.max(1,N-ti))+')'; g.beginPath(); g.moveTo(x,my); g.lineTo(x,my+10+18*(i-ti)/Math.max(1,N-ti)); g.stroke(); }
      if(echoFor(k)&&i<=ti){ g.fillStyle='rgba(74,217,255,.9)'; g.fillRect(x-1.5,my+4,3,3); }
    }
    g.strokeStyle='rgba(74,217,255,.95)'; g.beginPath(); g.moveTo(X(ti),6); g.lineTo(X(ti),H-6); g.stroke();
    g.fillStyle='rgba(255,179,71,.95)'; g.beginPath(); g.moveTo(x1,my-6); g.lineTo(x1+6,my); g.lineTo(x1,my+6); g.lineTo(x1-6,my); g.closePath(); g.fill();
  }
  $('rdv').addEventListener('click',openRdv);
  $('openDiary').addEventListener('click',openDiary);
  $('openAnch').addEventListener('click',function(){ openRoom('anchors'); });
  $('openArch').addEventListener('click',openArch);

  setInterval(function(){ if(dkey(new Date())!==today && viewKey===today && room.hidden && !sheet.classList.contains('open')) location.reload(); },60000);
  document.addEventListener('gesturestart',function(e){ e.preventDefault(); });

  applyBg();
  sizeWave();
  paintAll();
  if(!still) requestAnimationFrame(idle);
})();
</script>
</body>
</html>
