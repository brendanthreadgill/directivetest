<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Directive 2">
<meta name="theme-color" content="#040a07">
<title>The Directive: trial</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23040a07'/%3E%3Ccircle cx='90' cy='90' r='50' fill='none' stroke='%23ff4f86' stroke-width='5'/%3E%3Ccircle cx='90' cy='90' r='30' fill='none' stroke='%233bff9e' stroke-width='5'/%3E%3Ccircle cx='90' cy='90' r='9' fill='%23ffb347'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --g:#3bff9e; --g2:#4fbf8e; --g3:#1f5c43; --g4:#143d2c; --bg:#040a07; --amb:#ffb347; --b:#4ad9ff; --ink:#f1eadb; --dim:#8fa89b; --red:#ff6b6b; }
  *{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg)}
  body{color:var(--g);font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:16px;line-height:1.4;
    -webkit-user-select:none;user-select:none;overflow-x:hidden}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  :focus-visible{outline:1px solid var(--b);outline-offset:2px}
  [hidden]{display:none!important}
  .scan{position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(180deg,rgba(0,0,0,.26) 0 1px,transparent 1px 3px)}

  #bg{position:fixed;inset:0;background:center/cover no-repeat;opacity:.2;pointer-events:none;z-index:0}
  #index{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:10px;
    padding:max(12px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom))}
  .hdr{display:flex;justify-content:space-between;align-items:center;height:44px;border-bottom:1px solid var(--g3)}
  .hdr .id{font-size:11px;letter-spacing:.2em;text-shadow:0 0 8px rgba(59,255,158,.55)}
  .nav{display:flex;align-items:center;gap:2px}
  .navb{width:38px;height:44px;font-size:11px;color:var(--b)}
  .navb[disabled]{color:var(--g3)}
  .stamp{font-size:10px;letter-spacing:.18em;color:var(--g2);white-space:nowrap}
  body.past .hdr{border-bottom-color:var(--amb)} body.past .stamp{color:var(--amb)}
  .dual{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.18em;height:14px}
  .dual .r{color:var(--amb)}
  .cap{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.18em;color:var(--g2)}
  .blk{display:flex;flex-direction:column;gap:6px}

  .tx{border:1px solid var(--g3);padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
  .tx p{margin:0;min-height:40px;font-family:'Chakra Petch','JetBrains Mono',sans-serif;font-size:13px;line-height:1.5;letter-spacing:.02em;color:var(--ink)}
  .cap canvas{flex:1;height:12px;margin:0 10px;display:block}
  .tx.got #txStatus{color:var(--amb)}

  .rows{display:flex;flex-direction:column;gap:3px}
  .row{display:flex;align-items:center;gap:8px;height:40px;border:1px solid var(--g4);padding:2px 3px 2px 2px}
  .glyph{width:34px;height:34px;flex:0 0 auto;display:block}
  .glyph canvas{width:34px;height:34px;display:block}
  .row .lab{flex:1;font-size:10px;letter-spacing:.16em;color:var(--g2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .val{min-width:64px;text-align:right;font-size:13px;letter-spacing:.06em;color:var(--amb);text-shadow:0 0 8px rgba(255,179,71,.35);white-space:nowrap}
  .row .val.zero{color:#5c8f78;text-shadow:none}
  .cb{width:42px;height:34px;flex:0 0 auto;border:1px solid var(--g3);font-size:16px;color:var(--g2)}
  .cb:active{background:var(--g);border-color:var(--g);color:var(--bg)}

  .anch{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}
  .an{height:36px;border:1px solid var(--g3);font-size:10px;letter-spacing:.04em;color:var(--b)}
  .an.on{background:var(--g);border-color:var(--g);color:var(--bg);box-shadow:0 0 14px rgba(59,255,158,.4)}

  .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .wk{height:22px;border:1px solid var(--g3);position:relative}
  .wk.lit{background:rgba(59,255,158,.55);border-color:var(--g)}
  .wk.today{border-color:var(--b)}
  .wk.view{outline:1px solid var(--amb);outline-offset:1px}

  .ftr{display:flex;justify-content:space-between;align-items:center;height:44px;border-top:1px solid var(--g3);font-size:10px;letter-spacing:.14em;margin-top:auto}
  .ftr span{color:var(--g2);white-space:nowrap}
  .ftr button{height:44px;padding:0 8px;color:var(--b);letter-spacing:.14em}

  #room{position:fixed;inset:0;background:#0b0508;z-index:20}
  #room canvas{position:absolute;inset:0;width:100%;height:100%}
  #room .fade{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(rgba(11,5,8,0),rgba(11,5,8,.95) 60%);pointer-events:none}
  #room .top{position:absolute;top:max(8px,env(safe-area-inset-top));left:10px;right:16px;display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.18em;z-index:2}
  #room .back{height:44px;padding:0 8px;color:var(--b);letter-spacing:.18em}
  #roomTap{position:absolute;top:70px;left:0;right:0;bottom:200px;touch-action:none}
  #room .panel{position:absolute;left:20px;right:20px;bottom:max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;z-index:2}
  #room .hint{font-size:10px;letter-spacing:.14em;line-height:1.8;color:var(--g2)}
  #room .ctl{display:flex;justify-content:space-between;align-items:center;gap:12px}
  #room .ctl .l{font-size:10px;letter-spacing:.18em;color:var(--g2);line-height:1.8}
  #room .ctl .r{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  #room .big{min-width:64px;text-align:center;font-size:14px;letter-spacing:.06em;color:var(--amb)}
  #room .cb{width:48px;height:44px;font-size:18px;border-color:#2f8f66;color:#6fe0ae}

  .sheet{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;gap:12px;z-index:40;overflow:auto;-webkit-overflow-scrolling:touch;
    padding:calc(env(safe-area-inset-top) + 58px) 16px calc(env(safe-area-inset-bottom) + 24px)}
  .sheet.open{display:flex}
  .sheet h2{font-size:11px;letter-spacing:.22em;margin:0;font-weight:400}
  .sheet .close{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:12px;width:44px;height:44px;font-size:18px;color:var(--b);border:1px solid var(--g3);background:var(--bg);z-index:45}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  .acts button{border:1px solid var(--g3);color:var(--b);height:44px;padding:0 12px;font-size:10px;letter-spacing:.14em}
  .acts button:active{background:var(--g);border-color:var(--g);color:var(--bg)}
  .acts button.danger{color:var(--red)}
  table{width:100%;border-collapse:collapse;font-size:10px}
  th{color:var(--g2);font-weight:400;text-align:right;padding:6px 2px;border-bottom:1px solid var(--g3);letter-spacing:.06em;font-size:9px}
  th:first-child,td:first-child{text-align:left}
  td{text-align:right;padding:6px 2px;border-bottom:1px dotted var(--g3);color:var(--amb)}
  td:first-child{color:var(--g)}
  .tip{font-size:10px;color:var(--g2);line-height:1.7;letter-spacing:.06em;margin:0}
  .entry{border-bottom:1px dotted var(--g3);padding:10px 0}
  .entry .d{font-size:10px;letter-spacing:.18em;color:var(--amb)}
  .entry .t{font-family:'Chakra Petch','JetBrains Mono',sans-serif;font-size:13px;line-height:1.5;color:var(--ink);margin-top:4px}

  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(18px);background:var(--g);color:var(--bg);padding:9px 18px;font-size:10px;letter-spacing:.2em;opacity:0;transition:.2s;pointer-events:none;z-index:60;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="bg" aria-hidden="true"></div>
<main id="index">
  <div class="hdr">
    <span class="id">DIRECTIVE</span>
    <span class="nav">
      <button class="navb" id="prevDay" aria-label="Previous day">&#9664;</button>
      <span class="stamp" id="stamp"></span>
      <button class="navb" id="nextDay" aria-label="Next day">&#9654;</button>
    </span>
  </div>
  <div class="dual"><span id="dayNo"></span><span class="r" id="rdv">RENDEZVOUS NOT SET</span></div>

  <section class="tx" id="tx">
    <div class="cap"><span>&gt; TRANSMISSION</span><canvas id="txWave" aria-hidden="true"></canvas><span id="txStatus"></span></div>
    <p id="txText"></p>
  </section>

  <section class="blk">
    <div class="cap"><span>&gt; LEDGER</span></div>
    <div class="rows" id="rows"></div>
  </section>

  <section class="blk">
    <div class="cap"><span>&gt; ANCHORS</span><span id="sqCount"></span></div>
    <div class="anch" id="anchors"></div>
  </section>

  <section class="blk">
    <div class="cap"><span>&gt; LAST 7 DAYS</span><span id="weekEnd"></span></div>
    <div class="week" id="week"></div>
  </section>

  <div class="ftr">
    <span id="runTxt"></span>
    <span>
      <button id="openDiary">DIARY</button>
      <button id="openArch">ARCHIVE</button>
    </span>
  </div>
</main>

<div id="room" hidden>
  <canvas id="roomCv" aria-hidden="true"></canvas>
  <div class="fade"></div>
  <div class="top">
    <button class="back" id="roomBack">&#9664; INDEX</button>
    <span id="roomEdges"></span>
  </div>
  <button id="roomTap" aria-label="Add 10 minutes by adding an edge"></button>
  <div class="panel">
    <span class="hint">TAP +10M // DRAG TO TURN // NONE ARE REMOVED<br><span id="roomLinks"></span></span>
    <div class="ctl">
      <span class="l">ROOM 04 // GYM<br><span id="roomTotal"></span></span>
      <span class="r">
        <button class="cb" id="roomDec" aria-label="Correct this day by removing 10 minutes">&minus;</button>
        <span class="big" id="roomVal"></span>
        <button class="cb" id="roomInc" aria-label="Add 10 minutes">+</button>
      </span>
    </div>
  </div>
</div>

<div class="sheet" id="sheet">
  <button class="close" id="closeSheet" aria-label="Close">&#10005;</button>
  <h2 id="sheetTitle"></h2>
  <div class="acts" id="sheetActs"></div>
  <p class="tip" id="sheetNote"></p>
  <div id="sheetBody"></div>
  <p class="tip">STORED ON THIS PHONE ONLY. NOTHING IS TRANSMITTED.<br>EXPORT A BACKUP NOW AND THEN; CLEARING BROWSER DATA ERASES IT.</p>
</div>

<div class="scan"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var KEY='directive.v2.trial', OLD='directive.console.v1';
  function $(id){ return document.getElementById(id); }
  function pad(n,w){ return String(n).padStart(w||2,'0'); }
  function dkey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function parseKey(k){ var p=k.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
  function addDays(k,n){ var d=parseKey(k); d.setDate(d.getDate()+n); return dkey(d); }
  function hm(v){ return Math.floor(v/60)+'h'+pad(v%60); }
  function mins(v){ return v+'m'; }
  function num(v){ return v.toLocaleString('en-US'); }

  var METRICS=[
    {id:'steps',    label:'STEPS',    step:500, fmt:num,  col:'255,122,89'},
    {id:'sleep',    label:'SLEEP',    step:15,  fmt:hm,   col:'124,140,255'},
    {id:'calories', label:'CALORIES', step:20,  fmt:num,  col:'236,226,205'},
    {id:'gym',      label:'GYM',      step:10,  fmt:mins, col:'255,79,134', room:true},
    {id:'basilisk', label:'BASILISK', step:15,  fmt:mins, col:'64,224,208'},
    {id:'stretch',  label:'STRETCH',  step:10,  fmt:mins, col:'181,140,255'}
  ];
  var ANCHORS=[
    {id:'arrival',n:'ARRIVE'},{id:'t0900',n:'09:00'},{id:'t1200',n:'12:00'},{id:'t1400',n:'14:00'},{id:'departure',n:'DEPART'}
  ];
  // Trial set only. Throwaway placeholders, not part of any deck.
  var DECK=[
    "At 07:10 you remembered cold tile under bare feet, and stood on one leg while the kettle finished.",
    "At 10:15 you remembered a cat unfolding in a doorway, and did the same against the frame.",
    "At 12:30 you remembered bread torn by hand, and ate the first half of lunch without a screen.",
    "At 15:00 you remembered wet gravel on a ridge path, and took the long way round the building.",
    "At 16:40 you remembered the top of a long staircase, and climbed two flights you did not need to.",
    "At 18:00 you remembered a full pack on the last switchback, and carried the heavy thing slowly.",
    "At 20:30 you remembered sitting low by a fire, and rested in a deep squat until the breath slowed.",
    "At 21:00 you remembered reaching for the top shelf as a child, and held your arms overhead for a slow count of thirty.",
    "At 22:30 you remembered a tent going quiet, and left the phone in another room.",
    "At 09:00 you remembered water from a cold tap in summer, and drank a full glass before anything else."
  ];

  var still=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var today=dkey(new Date()), viewKey=today;
  var store;
  try{
    var raw=localStorage.getItem(KEY);
    if(raw) store=JSON.parse(raw);
  }catch(e){ console.warn('read failed',e); }
  if(!store||typeof store!=='object') store={v:2,days:{},txPos:0,start:today,lastExport:null,importedV1:false};
  store.days=store.days||{};
  if(typeof store.txPos!=='number') store.txPos=0;
  if(!store.start) store.start=today;

  var saveTimer=null;
  function save(){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(function(){
      try{ localStorage.setItem(KEY,JSON.stringify(store)); }
      catch(e){ toast('SAVE FAILED'); console.warn(e); }
    },100);
  }
  function blank(){ return {steps:0,sleep:0,calories:0,gym:0,basilisk:0,stretch:0,squats:[],tx:null}; }
  function peek(k){ return store.days[k]||blank(); }
  function touch(k){
    if(!store.days[k]) store.days[k]=blank();
    var d=store.days[k]; if(!Array.isArray(d.squats)) d.squats=[];
    return d;
  }
  function hasEntry(d){
    if(!d) return false;
    for(var i=0;i<METRICS.length;i++) if((d[METRICS[i].id]||0)>0) return true;
    return (d.squats||[]).length>0;
  }

  var toastEl=$('toast'), tTimer=null;
  function toast(m){ toastEl.textContent=m; toastEl.classList.add('show'); clearTimeout(tTimer); tTimer=setTimeout(function(){ toastEl.classList.remove('show'); },1600); }
  function buzz(){ if(navigator.vibrate) navigator.vibrate(8); }

  // ---------- header ----------
  var DAYS=['SUN','MON','TUE','WED','THU','FRI','SAT'], MONS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  var EARLIEST=addDays(today,-30);
  function paintHeader(){
    var d=parseKey(viewKey), isNow=viewKey===today;
    $('stamp').textContent=DAYS[d.getDay()]+' '+pad(d.getDate())+' '+MONS[d.getMonth()];
    document.body.classList.toggle('past',!isNow);
    $('nextDay').disabled=isNow;
    $('prevDay').disabled=viewKey<=EARLIEST;
    var n=Math.round((parseKey(viewKey)-parseKey(store.start))/864e5)+1;
    $('dayNo').textContent=n>=1 ? 'TRIAL DAY '+pad(n,3)+' →' : 'BEFORE TRIAL';
  }

  // ---------- transmission ----------
  // The line arrives a few characters at a time; tap it to skip.
  var typed='', typeTimer=null, typing=false;
  function typeTx(text){
    var el=$('txText');
    if(text===typed) return;
    typed=text; clearInterval(typeTimer);
    if(still){ el.textContent=text; typing=false; return; }
    var n=0; typing=true;
    typeTimer=setInterval(function(){
      n+=2;
      if(n>=text.length){ clearInterval(typeTimer); typing=false; el.textContent=text; return; }
      el.textContent=text.slice(0,n)+'▌';
    },26);
  }
  $('txText').addEventListener('click',function(){ if(typing){ clearInterval(typeTimer); typing=false; $('txText').textContent=typed; } });
  function deal(){
    if(viewKey!==today) return;
    var d=touch(today);
    if(!d.tx){ d.tx={id:store.txPos%DECK.length,status:'dealt'}; store.txPos++; save(); }
  }
  function paintTx(){
    var d=peek(viewKey), tx=d.tx;
    $('tx').classList.toggle('got',!!tx);
    if(!tx){ typeTx('No signal was received on this day.'); $('txStatus').textContent='NO SIGNAL'; return; }
    typeTx(DECK[tx.id%DECK.length]);
    $('txStatus').textContent='RECEIVED';
  }

  // ---------- glyphs ----------
  function icoVerts(){
    var phi=(1+Math.sqrt(5))/2, V=[];
    [-1,1].forEach(function(a){ [-phi,phi].forEach(function(b){ V.push([0,a,b]); V.push([a,b,0]); V.push([b,0,a]); }); });
    return V;
  }
  function near(V,i,j){ var d=Math.pow(V[i][0]-V[j][0],2)+Math.pow(V[i][1]-V[j][1],2)+Math.pow(V[i][2]-V[j][2],2); return Math.abs(d-4)<0.01; }
  // Each glyph moves on its own and lights in proportion to the day's number:
  // unlit parts stay as a faint ghost, lit parts brighten as you log, a tap pulses it.
  var TARGET={steps:15000,sleep:480,calories:2200,gym:60,basilisk:60,stretch:20};
  var ICO=icoVerts(), ICO_E=[];
  (function(){ for(var i=0;i<12;i++) for(var k=i+1;k<12;k++) if(near(ICO,i,k)) ICO_E.push([i,k]); })();
  var glyphs={};
  function cl(v){ return v<0?0:(v>1?1:v); }
  function frac(id){ return cl((peek(viewKey)[id]||0)/TARGET[id]); }
  function glyph(c,id,col){ glyphs[id]={c:c,g:c.getContext('2d'),col:col,shown:frac(id),pulse:0}; drawGlyph(id,0); }
  function drawGlyph(id,now){
    var G=glyphs[id], g=G.g, col=G.col, cx=44, cy=44, i, k, a, r, x, y, n;
    var want=frac(id); G.shown+=still?(want-G.shown):(want-G.shown)*0.06; var p=G.shown;
    var t=still?0:now*0.001, pu=G.pulse&&!still?cl(1-(now-G.pulse)/700):0;
    var LO=0.13, HI=0.9;
    function S(lit){ g.strokeStyle='rgba('+col+','+Math.min(1,LO+(HI-LO)*lit+pu*0.35).toFixed(3)+')'; }
    g.clearRect(0,0,88,88); g.globalCompositeOperation='lighter'; g.lineWidth=1;
    if(id==='steps'){
      for(k=0;k<5;k++){ S(cl(p*5-k)); g.beginPath(); for(i=0;i<=60;i++){ a=i/60*6.2832; r=(8+k*7)*(1+0.16*Math.sin(3*a+k+t*0.7*(k%2?1:-1))+0.08*Math.sin(5*a-t*0.5)); x=cx+Math.cos(a)*r; y=cy+Math.sin(a)*r; if(i===0) g.moveTo(x,y); else g.lineTo(x,y); } g.stroke(); }
    } else if(id==='sleep'){
      n=72;
      for(i=0;i<n;i++){ S(cl(p*n-i)); a=i/n*6.2832+t*0.12-1.5708; r=24+((i*37)%14)*(0.65+0.35*Math.sin(t*1.1+i*0.7)); g.beginPath(); g.moveTo(cx+Math.cos(a)*10,cy+Math.sin(a)*10); g.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r); g.stroke(); }
    } else if(id==='calories'){
      for(k=0;k<7;k++){ S(cl(p*7-k)); y=68-k*8+Math.sin(t*0.6+k*1.3)*1.2; g.beginPath(); g.moveTo(12+Math.sin(t*0.4+k)*3,y); g.lineTo(46+((k*23)%30)+Math.sin(t*0.8+k)*5,y); g.stroke(); }
    } else if(id==='gym'){
      var ry=0.5+t*0.35, rx=0.35+Math.sin(t*0.5)*0.15;
      var P=ICO.map(function(v){ var x1=v[0]*Math.cos(ry)+v[2]*Math.sin(ry), z1=-v[0]*Math.sin(ry)+v[2]*Math.cos(ry); var y1=v[1]*Math.cos(rx)-z1*Math.sin(rx); return [cx+x1*17,cy+y1*17]; });
      n=ICO_E.length;
      for(i=0;i<n;i++){ S(cl(p*n-i)); var e=ICO_E[i]; g.beginPath(); g.moveTo(P[e[0]][0],P[e[0]][1]); g.lineTo(P[e[1]][0],P[e[1]][1]); g.stroke(); }
    } else if(id==='basilisk'){

        catch(e){ toast('IMAGE TOO LARGE'); }
      };
      im.onerror=function(){ URL.revokeObjectURL(url); toast('COULD NOT READ IMAGE'); };
      im.src=url;
    });
    inp.click();
  }
  function openArch(){
    openSheet('ARCHIVE');
    act('BACKGROUND IMAGE',pickBg);
    if(applyBg()) act('REMOVE BACKGROUND',function(){ try{ localStorage.removeItem(BGKEY); }catch(e){} applyBg(); toast('BACKGROUND REMOVED'); openArch(); });
    act('EXPORT CSV',function(){ if(!Object.keys(store.days).length){ toast('NOTHING TO EXPORT'); return; } download('directive-v2-'+today+'.csv',csv(),'text/csv'); toast('EXPORTED'); note(); });
    act('COPY CSV',function(){ copyText(csv()); });
    act('FULL BACKUP',function(){ download('directive-v2-backup-'+today+'.json',JSON.stringify(store),'application/json'); toast('BACKUP SAVED'); note(); });
    var old=oldDays();
    if(old){
      var n=Object.keys(old).filter(function(k){ return !store.days[k]; }).length;
      if(n) act('IMPORT '+n+' OLD DAYS',function(){
        Object.keys(old).forEach(function(k){
          if(store.days[k]) return;
          var o=old[k]||{};
          store.days[k]={steps:o.steps||0,sleep:o.sleep||0,calories:o.calories||0,gym:o.gym||0,basilisk:o.basilisk||0,stretch:o.stretch||0,squats:Array.isArray(o.squats)?o.squats.slice():[],tx:null};
        });
        store.importedV1=true; save(); toast('IMPORTED'); openArch(); paintAll();
      });
    }
    act('CLEAR THIS DAY',function(){
      if(!confirm('Clear all entries for '+viewKey+'?')) return;
      delete store.days[viewKey]; save(); paintAll(); $('sheetBody').innerHTML=histHTML(); toast('RECORD CLEARED');
    },'danger');
    function note(){ $('sheetNote').textContent=store.lastExport?'LAST EXPORT: '+store.lastExport:'NEVER EXPORTED'; }
    note();
    $('sheetBody').innerHTML=histHTML();
  }
  $('openDiary').addEventListener('click',openDiary);
  $('openArch').addEventListener('click',openArch);

  setInterval(function(){ if(dkey(new Date())!==today && viewKey===today && room.hidden && !sheet.classList.contains('open')) location.reload(); },60000);
  document.addEventListener('gesturestart',function(e){ e.preventDefault(); });

  applyBg();
  sizeWave();
  paintAll();
  if(!still) requestAnimationFrame(idle);
})();
</script>
</body>
</html>
